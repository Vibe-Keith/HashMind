[project]
name = "hashcortex"
version = "0.1.0"
description = "HashCortex-S9: GGUF -> SHA-256 ASIC feature architecture (research prototype)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hashcortex = "hashcortex.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hashcortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples"]
