[project]
name = "hashmind"
version = "0.2.0"
description = "HashMind: GGUF -> SHA-256 ASIC feature architecture (research prototype)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
quants = ["gguf>=0.10"]  # IQ* dequantization + reference tests

[project.scripts]
hashmind = "hashmind.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hashmind*", "hashcortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples"]
